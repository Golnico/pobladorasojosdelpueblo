<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campeonato Thyaresita</title>
<style>
  /* ====== CONFIGURA AQUÍ ====== */
</style>
<script>
  // 1) En Google Sheets: Archivo > Compartir > Publicar en la Web > "Todo el documento" > Publicar.
  //    Copia el link que te da (termina en /pubhtml) y pégalo aquí:
  const LINK_PUBLICADO = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_ucXiBHdM7pzf-__Ylyjlq8m0UcbgiG-f1GVgONJSYIqLkPlJgBqZmH-fqGVwFg/pubhtml";
  // 2) El "gid" de cada pestaña (ya configurado): abre la pestaña en Sheets y mira el final de la URL (#gid=123456).
  const GID = { tabla: "1890945875", fixture: "1160588670" };
  // Cada cuántos segundos se actualiza la página
  const REFRESCO_SEG = 60;
</script>
<style>
  :root{--bg:#0f1720;--card:#16212c;--line:#24323f;--txt:#e8eef3;--mut:#8ea0b0;--acc:#2fbf71;--gold:#f2c94c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{padding:24px 16px 8px;text-align:center}
  h1{margin:0;font-size:1.8rem;letter-spacing:.5px}
  .sub{color:var(--mut);font-size:.85rem;margin-top:4px}
  nav{display:flex;gap:8px;justify-content:center;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:2}
  nav button{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:.95rem;cursor:pointer}
  nav button.on{background:var(--acc);border-color:var(--acc);color:#06210f;font-weight:700}
  main{max-width:820px;margin:0 auto;padding:8px 16px 40px}
  section{display:none}section.on{display:block}
  .wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--mut);font-weight:600;font-size:.78rem;text-transform:uppercase}
  td.n{text-align:left;font-weight:600}
  tr:last-child td{border-bottom:0}
  tr.top td{background:rgba(242,201,76,.12)}
  tr.top td:first-child{color:var(--gold);font-weight:800}
  td.pts{font-weight:800;color:var(--acc)}
  .m{display:grid;grid-template-columns:52px 1fr auto 1fr;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .m .h{color:var(--mut);font-size:.85rem}
  .m .l{text-align:right;font-weight:600}.m .v{font-weight:600}
  .m .r{background:var(--bg);border-radius:8px;padding:6px 10px;font-weight:800;min-width:64px;text-align:center}
  .m.fin{border-color:var(--gold)}.m.fin .h{color:var(--gold);font-weight:700}
  .eq{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .eq div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:600}
  .eq small{display:block;color:var(--mut);font-weight:400;margin-top:4px}
  .nota{color:var(--mut);font-size:.8rem;text-align:center;margin-top:12px}
  .err{background:#3a1d1d;border:1px solid #7a3232;padding:14px;border-radius:12px}
  @media (max-width:480px){.m{grid-template-columns:44px 1fr auto 1fr;font-size:.85rem}}
</style>
</head>
<body>
<header><h1>⚽ Campeonato Thyaresita</h1><div class="sub">Sábado 10/10/2026</div><div class="sub" id="act">Cargando…</div></header>
<nav>
  <button data-t="tabla" class="on">Tabla</button>
  <button data-t="fixture">Fixture</button>
</nav>
<main>
  <section id="tabla" class="on"></section>
  <section id="fixture"></section>
</main>
<script>
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button,section").forEach(e=>e.classList.remove("on"));
  b.classList.add("on");document.getElementById(b.dataset.t).classList.add("on");
});
function csv(t){const R=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}
    else if(ch=='\n'){r.push(c);R.push(r);r=[];c=""}else if(ch!='\r')c+=ch}
  r.push(c);R.push(r);return R}
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function hoja(gid){
  const u=LINK_PUBLICADO.replace(/\/pub(html)?.*$/,"")+"/pub?gid="+gid+"&single=true&output=csv&t="+Date.now();
  const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return csv(await r.text())}
function verTabla(R){
  const f=R.filter(r=>/^\d+$/.test((r[0]||"").trim()));
  document.getElementById("tabla").innerHTML=`<div class="wrap"><table><thead><tr><th>#</th><th style="text-align:left">Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead><tbody>${
    f.map((r,i)=>`<tr class="${i<2?"top":""}"><td>${esc(r[0])}</td><td class="n">${esc(r[1])}</td>${r.slice(2,9).map(x=>`<td>${esc(x)}</td>`).join("")}<td class="pts">${esc(r[9])}</td></tr>`).join("")
  }</tbody></table></div><p class="nota">Los 2 primeros (dorado) juegan la final · Ganar 3 pts · Empatar 1 pt</p>`}
function verFixture(R){
  const f=R.filter(r=>/^(\d+|Final)$/i.test((r[0]||"").trim()));
  document.getElementById("fixture").innerHTML=f.map(r=>{
    const fin=/final/i.test(r[0]),jug=r[3]!==""&&r[4]!=="";
    return `<div class="m ${fin?"fin":""}"><span class="h">${fin?"FINAL<br>":""}${esc(r[1])}</span><span class="l">${esc(r[2])}</span><span class="r">${jug?esc(r[3])+" - "+esc(r[4]):"vs"}</span><span class="v">${esc(r[5])}</span></div>`}).join("")}
function verEquipos(R){
  const f=R.slice(1).filter(r=>(r[0]||"").trim()&&r[1]!==undefined&&/^\d+$/.test((r[1]||"").trim()));
  document.getElementById("equipos").innerHTML=`<div class="eq">${f.map(r=>`<div>${esc(r[0])}<small>${esc(r[1])} jugados · ${esc(r[8])} pts</small></div>`).join("")}</div>`}
async function cargar(){
  try{
    const [t,fx]=await Promise.all([hoja(GID.tabla),hoja(GID.fixture)]);
    verTabla(t);verFixture(fx);
    document.getElementById("act").textContent="Actualizado a las "+new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    document.getElementById("tabla").innerHTML=`<div class="err">No se pudo leer la planilla. Revisa que esté <b>publicada en la Web</b> y que el link y los gid de arriba estén bien.<br><small>${esc(e.message)}</small></div>`;
    document.getElementById("act").textContent="Error al cargar";
  }}
cargar();setInterval(cargar,REFRESCO_SEG*1000);
</script>
</body>
</html>
