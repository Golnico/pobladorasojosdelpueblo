<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campeonato Thyaresita</title>
<style>
  /* ====== CONFIGURA AQUÍ ====== */
</style>
<script>
  // 1) En Google Sheets: Archivo > Compartir > Publicar en la Web > "Todo el documento" > Publicar.
  //    Copia el link que te da (termina en /pubhtml) y pégalo aquí:
  const LINK_PUBLICADO = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_ucXiBHdM7pzf-__Ylyjlq8m0UcbgiG-f1GVgONJSYIqLkPlJgBqZmH-fqGVwFg/pubhtml";
  // 2) El "gid" de cada pestaña (ya configurado): abre la pestaña en Sheets y mira el final de la URL (#gid=123456).
  const GID = { tabla: "1890945875", fixture: "1160588670" };
  // Cada cuántos segundos se actualiza la página
  const REFRESCO_SEG = 60;
</script>
<style>
  :root{--bg:#000;--card:#1c1c1e;--line:#2c2c2e;--txt:#f2f2f7;--mut:#8e8e93;--acc:#a855f7;--gold:#f2c94c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{padding:24px 16px 8px;text-align:center}
  h1{margin:0;font-size:1.8rem;letter-spacing:.5px}
  .sub{color:var(--mut);font-size:.85rem;margin-top:4px}
  nav{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 16px}
  .seg{display:flex;max-width:788px;margin:0 auto;background:#1c1c1e;border:1px solid #2c2c2e;border-radius:12px;padding:4px}
  nav button{flex:1;background:none;border:0;color:#d1d1d6;padding:9px 0;border-radius:9px;font-size:.92rem;font-weight:500;cursor:pointer;transition:background .15s}
  nav button.on{background:#3a2a52;color:#fff;font-weight:600}
  main{max-width:820px;margin:0 auto;padding:8px 16px 40px}
  section{display:none}section.on{display:block}
  .wrap{background:var(--card);border-radius:18px;padding:14px 10px 6px;overflow-x:auto}
  .wrap h2{margin:0 0 6px;text-align:center;font-size:1rem;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  th,td{padding:12px 6px;text-align:center;white-space:nowrap}
  th{color:var(--mut);font-weight:500;font-size:.8rem;padding-bottom:6px}
  th.n,td.n{text-align:left;padding-left:12px}
  td.n{font-weight:500}
  td.p{color:var(--txt);width:28px;position:relative}
  tr.top td.p::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--acc)}
  td.pts{font-weight:700}
  .m{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:linear-gradient(100deg,#1c1c1e 0%,#241a2e 50%,#1c1c1e 100%);border-radius:16px;padding:22px 18px 14px;margin-bottom:8px;overflow:hidden}
  .m .lb{position:absolute;top:8px;left:0;right:0;text-align:center;color:var(--mut);font-size:.72rem;letter-spacing:.5px;text-transform:uppercase}
  .m .t{display:flex;flex-direction:column;gap:2px}
  .m .t.v{align-items:flex-end;text-align:right}
  .m .g{font-size:2.4rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .m .nm{font-size:.82rem;color:#d1d1d6;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m .lose .g{color:#636366}
  .m .pend .g{color:#3a3a3c}
  .m .c{text-align:center;font-weight:700;font-size:1rem;padding:0 6px}
  .m .c small{display:block;color:var(--mut);font-weight:500;font-size:.72rem;margin-top:2px}
  .m.fin{background:linear-gradient(100deg,#2a1640 0%,#4c1d95 50%,#2a1640 100%)}
  .m.fin .lb{color:#e9d5ff;font-weight:700}
  .eq{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .eq div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:600}
  .eq small{display:block;color:var(--mut);font-weight:400;margin-top:4px}
  .nota{color:var(--mut);font-size:.8rem;text-align:center;margin-top:12px}
  .err{background:#3a1d1d;border:1px solid #7a3232;padding:14px;border-radius:12px}

</style>
</head>
<body>
<header><h1>CAMPEONATO THYAREISITA</h1><div class="sub">Sábado 10/10/2026</div><div class="sub" id="act">Cargando…</div></header>
<nav><div class="seg">
  <button data-t="tabla" class="on">Tabla</button>
  <button data-t="fixture">Fixture</button>
</div></nav>
<main>
  <section id="tabla" class="on"></section>
  <section id="fixture"></section>
</main>
<script>
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button,section").forEach(e=>e.classList.remove("on"));
  b.classList.add("on");document.getElementById(b.dataset.t).classList.add("on");
});
function csv(t){const R=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}
    else if(ch=='\n'){r.push(c);R.push(r);r=[];c=""}else if(ch!='\r')c+=ch}
  r.push(c);R.push(r);return R}
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function hoja(gid){
  const u=LINK_PUBLICADO.replace(/\/pub(html)?.*$/,"")+"/pub?gid="+gid+"&single=true&output=csv&t="+Date.now();
  const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return csv(await r.text())}
function verTabla(R){
  const f=R.filter(r=>/^\d+$/.test((r[0]||"").trim()));
  document.getElementById("tabla").innerHTML=`<div class="wrap"><h2>Tabla</h2><table><thead><tr><th></th><th class="n">Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>PTS</th></tr></thead><tbody>${
    f.map((r,i)=>{const dg=Number(r[8])||0;return `<tr class="${i<2?"top":""}"><td class="p">${esc(r[0])}</td><td class="n">${esc(r[1])}</td>${r.slice(2,6).map(x=>`<td>${esc(x)}</td>`).join("")}<td>${dg>0?"+"+dg:dg}</td><td class="pts">${esc(r[9])}</td></tr>`}).join("")
  }</tbody></table></div><p class="nota"><span style="color:var(--acc)">▍</span>Los 2 primeros juegan la final · Ganar 3 pts · Empatar 1 pt</p>`}
function verFixture(R){
  const f=R.filter(r=>/^(\d+|Final)$/i.test((r[0]||"").trim()));
  const listo=f.filter(r=>!/final/i.test(r[0])).every(r=>(r[3]??"")!==""&&(r[4]??"")!=="");
  document.getElementById("fixture").innerHTML=f.map(r=>{
    const fin=/final/i.test(r[0]);
    if(fin&&!listo){r=[...r];r[2]="1º de la tabla";r[5]="2º de la tabla";}
    const jug=(r[3]??"")!==""&&(r[4]??"")!=="";
    const a=Number(r[3]),b=Number(r[4]);
    const cl=x=>!jug?"pend":(x?"":"lose");
    return `<div class="m ${fin?"fin":""}"><div class="lb">${fin?"🏆 Final":"Partido "+esc(r[0])}</div>
      <div class="t ${cl(a>=b)}"><span class="g">${jug?esc(r[3]):"–"}</span><span class="nm">${esc(r[2])}</span></div>
      <div class="c">${jug?"Terminado":esc(r[1])}${jug?`<small>${esc(r[1])}</small>`:""}</div>
      <div class="t v ${cl(b>=a)}"><span class="g">${jug?esc(r[4]):"–"}</span><span class="nm">${esc(r[5])}</span></div></div>`}).join("")}
function verEquipos(R){
  const f=R.slice(1).filter(r=>(r[0]||"").trim()&&r[1]!==undefined&&/^\d+$/.test((r[1]||"").trim()));
  document.getElementById("equipos").innerHTML=`<div class="eq">${f.map(r=>`<div>${esc(r[0])}<small>${esc(r[1])} jugados · ${esc(r[8])} pts</small></div>`).join("")}</div>`}
async function cargar(){
  try{
    const [t,fx]=await Promise.all([hoja(GID.tabla),hoja(GID.fixture)]);
    verTabla(t);verFixture(fx);
    document.getElementById("act").textContent="Actualizado a las "+new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    document.getElementById("tabla").innerHTML=`<div class="err">No se pudo leer la planilla. Revisa que esté <b>publicada en la Web</b> y que el link y los gid de arriba estén bien.<br><small>${esc(e.message)}</small></div>`;
    document.getElementById("act").textContent="Error al cargar";
  }}
cargar();setInterval(cargar,REFRESCO_SEG*1000);
</script>
</body>
</html>
